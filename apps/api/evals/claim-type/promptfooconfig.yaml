description: 闸① claim_type 评测 —— 结构层三类 + 闸门层二值（不进 CI / check-dev.sh）
prompts:
  - file://prompt.txt
providers:
  # 裁判模型名写死；端点与 key 从本地 .env 读
  - id: openai:chat:qwen3.8-flash
    config:
      apiBaseUrl: '{{env.OPENAI_BASE_URL}}'
      apiKeyEnvar: OPENAI_API_KEY
      temperature: 0
      # 与线上判官的 jsonMode 对齐；否则推理模型会把 Thinking 混进输出
      response_format: { type: 'json_object' }
tests: file://dataset.jsonl
defaultTest:
  assert:
    # 第一层（确定性）：输出里能解析出三类之一的 claim_type
    - type: javascript
      value: |
        const raw = output.trim();
        const matches = [...raw.matchAll(/\{[^{}]*\}/g)];
        const last = matches.length > 0 ? matches[matches.length - 1][0] : '';
        try {
          const value = JSON.parse(last).claim_type;
          return ['陈述', '演示', '寒暄'].includes(value);
        } catch {
          return false;
        }
    # 第二层（确定性）：只比「可引用 / 不可引用」——唯一可引用的是「陈述」
    - type: javascript
      value: |
        const CITABLE = ['陈述'];
        const expected = String(context.vars.expected || '').trim();
        const raw = output.trim();
        const matches = [...raw.matchAll(/\{[^{}]*\}/g)];
        const last = matches.length > 0 ? matches[matches.length - 1][0] : '';
        let actual = '';
        try {
          actual = String(JSON.parse(last).claim_type || '').trim();
        } catch {
          actual = '';
        }
        const pass = CITABLE.includes(actual) === CITABLE.includes(expected);
        return {
          pass,
          score: pass ? 1 : 0,
          reason: `标注=${expected || '?'}（${CITABLE.includes(expected) ? '可引用' : '不可引用'}），模型=${actual || '解析失败'}（${CITABLE.includes(actual) ? '可引用' : '不可引用'}）`,
        };