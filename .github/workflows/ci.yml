# ─────────────────────────────────────────────────────────────────────
# know-fit CI（ADR-021：现在就建；仓库为 private）
#
# 🔴 与本地同源：本工作流跑的就是 `bash scripts/check-dev.sh` ——
#    CI 不另写一套命令（ADR-021）。唯一的差别是数据库的来源：
#    本地是 `pnpm db:up`（compose），CI 是下面的 services: 容器，
#    故 CI 侧设 SKIP_DB_UP=1 让脚本跳过 db:up。
#
# 🔴 CI 里不许有任何 key、不许有 `secrets.*`：
#    check-dev.sh 显式以 LLM_PROVIDER=fake 起服务，全链路不联网。
#    真实模型的准确率只能在作者本地跑 `llm:smoke`（ADR-022 决定四）。
#
# 🔴 数据库容器（ADR-019 补注四：dev-002 起必须补）：
#    镜像 tag 与 docker-compose.yml **同一串** —— 版本漂移会让
#    「HNSW 行为变了」变成无法复现的 bug（ADR-019 决策 A）。
#    口令是本地开发用的那串（不是机密）：CI 容器一次性、随 runner 销毁。
# ─────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: knowfit
          POSTGRES_PASSWORD: knowfit
          POSTGRES_DB: knowfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowfit -d knowfit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # 读根 package.json 的 packageManager 字段决定 pnpm 版本
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 与根 package.json 的 engines.node 同值（ADR-019 补注五）
          node-version: '22.x'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 执行闸门：db（外部提供）→ verify → 探活 → 端到端往返
      # 失败时把 dev server 日志一起打出来，否则「探活失败」没法定因
      - name: Gate (scripts/check-dev.sh)
        env:
          SKIP_DB_UP: '1'
        run: bash scripts/check-dev.sh

      - name: Dev server log (on failure)
        if: failure()
        run: |
          if [ -f /tmp/knowfit-dev.log ]; then
            echo '--- dev server log ---'
            tail -n 100 /tmp/knowfit-dev.log
          else
            echo '（没有 dev server 日志 —— 故障发生在起服务之前）'
          fi