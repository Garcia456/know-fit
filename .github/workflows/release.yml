# ─────────────────────────────────────────────────────────────────────
# 发布：构建并推送生产镜像到 GHCR
#
# ⚠️ 只构建，不部署 —— 服务器 SSH 私钥不进 GitHub。
#    部署由作者在服务器上执行 scripts/deploy.sh <tag>。
#
# tag 用提交短哈希（不可变），同时维护 latest 方便手动拉取；
# 回滚时按 sha tag 切回，不依赖 latest。
#
# 🔴 镜像里不含任何密钥：.env / deploy/.env.production 由 .dockerignore 挡住，
#    运行期从服务器上的 deploy/.env.production 注入。
#    换 API key 不需要重新构建镜像。
# ─────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-api:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-web:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "| 镜像 | tag |"
            echo "|---|---|"
            echo "| \`ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-api\` | \`${{ steps.vars.outputs.tag }}\` |"
            echo "| \`ghcr.io/${{ steps.vars.outputs.owner }}/know-fit-web\` | \`${{ steps.vars.outputs.tag }}\` |"
            echo ""
            echo "服务器部署：\`bash scripts/deploy.sh ${{ steps.vars.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
