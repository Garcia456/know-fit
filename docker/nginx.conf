server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带哈希的构建产物可长缓存；入口文件不缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退：/api 不会走到这里（由 Caddy 直接转给 API）
    location / {
        try_files $uri $uri/ /index.html;
    }
}